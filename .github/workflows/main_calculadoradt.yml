name: Deploy CotizadorInterno.Web to Azure App Service

env:
  AZURE_WEBAPP_NAME: calculadoradt
  AZURE_RESOURCE_GROUP: DigitalTechAppAI
  AZURE_CLIENT_ID: 774a5f8a-8b6c-4e43-83a1-3efd8a90cea0
  AZURE_TENANT_ID: cab7ea42-4a21-4548-952f-fcde81f2bdd6
  AZURE_SUBSCRIPTION_ID: 7018b9b6-5dfc-4d91-bc4d-5f29f27553bd
  DOTNET_VERSION: 10.x

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: calculadoradt-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build, package and deploy
        shell: pwsh
        run: >
          ./scripts/Deploy-AppService.ps1
          -SubscriptionId "${{ env.AZURE_SUBSCRIPTION_ID }}"
          -ResourceGroupName "${{ env.AZURE_RESOURCE_GROUP }}"
          -WebAppName "${{ env.AZURE_WEBAPP_NAME }}"
          -Configuration Release
